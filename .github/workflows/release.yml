name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing git tag to release (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  guard:
    name: Version Guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      sha: ${{ steps.check.outputs.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Validate tag, ancestry, changelog, and release uniqueness
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME:-}" = "workflow_dispatch" ]; then
            RAW_TAG="${INPUT_TAG:-}"
          else
            RAW_TAG="${GITHUB_REF_NAME:-}"
          fi

          VERSION="${RAW_TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Error: Tag '$RAW_TAG' (resolved version '$VERSION') must match SemVer X.Y.Z or X.Y.Z-<prerelease>." >&2
            exit 1
          fi

          git fetch --tags --force origin
          if ! git show-ref --verify --quiet "refs/tags/v${VERSION}"; then
            echo "Error: Tag 'v${VERSION}' does not exist locally or on origin. Create and push the annotated tag first (git tag -a v${VERSION} -m \"Release v${VERSION}\" && git push origin v${VERSION})." >&2
            exit 1
          fi

          TAG_TYPE=$(git cat-file -t "refs/tags/v${VERSION}")
          if [ "$TAG_TYPE" != "tag" ]; then
            echo "Error: Tag 'v${VERSION}' is '${TAG_TYPE}', not an annotated tag. Recreate it with 'git tag -a v${VERSION} -m \"Release v${VERSION}\"'." >&2
            exit 1
          fi

          git checkout --detach "refs/tags/v${VERSION}"
          SHA=$(git rev-parse HEAD)

          PUBSPEC_VERSION=$(sed -n 's/^version:[[:space:]]*\([^+#[:space:]]*\).*/\1/p' pubspec.yaml | head -n1)
          APP_VERSION=$(sed -n "s/^const String kAppVersion = ['\"]\([^'\"]*\)['\"];.*/\1/p" lib/core/app_info.dart | head -n1)

          if [ "$VERSION" != "$PUBSPEC_VERSION" ] || [ "$VERSION" != "$APP_VERSION" ]; then
            echo "Error: Version mismatch — tag='$VERSION', pubspec.yaml='$PUBSPEC_VERSION', kAppVersion='$APP_VERSION'." >&2
            exit 1
          fi

          if ! VERSION="$VERSION" python3 -c '
          import os, pathlib, re, sys
          version = os.environ["VERSION"]
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          sys.exit(0 if re.search(rf"^## \[{re.escape(version)}\](?:[ \t]|$)", text, re.MULTILINE) else 1)
          '; then
            echo "Error: CHANGELOG.md does not contain a heading '## [${VERSION}]'." >&2
            exit 1
          fi

          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "Error: Tagged commit '$SHA' (v${VERSION}) is not an ancestor of origin/main." >&2
            exit 1
          fi

          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Error: GitHub release 'v${VERSION}' already exists." >&2
            exit 1
          fi

          echo "Version guard passed: v${VERSION} (${SHA})"
          {
            echo "version=${VERSION}"
            echo "sha=${SHA}"
          } >> "$GITHUB_OUTPUT"

  verify:
    name: Analyze & Test
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.sha }}
          fetch-depth: 1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run static analysis
        run: flutter analyze

      - name: Run test suite
        run: flutter test --reporter expanded

  build:
    name: Build Release Artifacts
    needs: [guard, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.sha }}
          fetch-depth: 1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK (release)
        run: flutter build apk --release --build-number ${{ github.run_number }}

      - name: Build Web bundle (release)
        run: flutter build web --release

      - name: Package release artifacts
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/compozy-app-${VERSION}-android.apk"
          (cd build/web && zip -r "../../dist/compozy-app-${VERSION}-web.zip" .)

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: compozy-app-android
          path: dist/compozy-app-${{ needs.guard.outputs.version }}-android.apk
          if-no-files-found: error

      - name: Upload Web bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: compozy-app-web
          path: dist/compozy-app-${{ needs.guard.outputs.version }}-web.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [guard, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.sha }}
          fetch-depth: 1

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Extract release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re

          version = os.environ["VERSION"]
          changelog = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = re.compile(
              rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## |\Z)",
              re.MULTILINE | re.DOTALL,
          )
          match = pattern.search(changelog)
          notes = match.group(1).strip() if match else ""
          if not notes:
              notes = "See CHANGELOG.md"
          pathlib.Path("dist/release-notes.md").write_text(notes + "\n", encoding="utf-8")
          PY

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          PRERELEASE_FLAG=()
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE_FLAG+=(--prerelease)
          fi
          gh release create "v${VERSION}" \
            "dist/compozy-app-${VERSION}-android.apk" \
            "dist/compozy-app-${VERSION}-web.zip" \
            --title "v${VERSION} (beta)" \
            --notes-file dist/release-notes.md \
            "${PRERELEASE_FLAG[@]}"
